# Dependabot opens pull requests when dependencies or GitHub Actions have newer versions.
# CI (lint + tests on Node 20 and 24) runs on every one of them; merge when it is green.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR per week for all low-risk bumps instead of a PR per package.
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
